services:
  # Ba
  db:
    image: mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: quacker
      MYSQL_USER: quackerUser
      MYSQL_PASSWORD: quackerPassword
    networks:
      - app-network
    ports:
      - '3306:3306'
    volumes:
      - mariadb-data:/var/lib/mysql

  adminer:
    image: adminer
    restart: always
    ports:
      - '8080:8080'
    environment:
      - ADMINER_DEFAULT_SERVER=db
    networks:
      - app-network
    depends_on:
      - db

  be:
    image: node:22.15.0-alpine
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nest-api
    restart: unless-stopped
    ports:
      - '4000:4000'
      - '5555:5555'
    volumes:
      - .:/app
      - /app/node_modules
      - uploads-data:/app/uploads
    environment:
      - NODE_ENV=development
      - DATABASE_URL=mysql://quackerUser:quackerPassword@db:3306/quacker
      - DATABASE_PROVIDER=mysql
      - BETTER_AUTH_SECRET=development_secret_key_change_in_production
      - SUPERADMIN_EMAIL=admin@example.com
      - SUPERADMIN_PASSWORD=adminpassword
    networks:
      - app-network
    depends_on:
      - db

networks:
  app-network:
    driver: bridge

volumes:
  uploads-data:
  mariadb-data:
